<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPLS Admin - Login</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .login-page {
            background: transparent;
        }
        .login-box {
            width: 400px;
        }
        .login-card-body {
            border-radius: 10px;
        }
        .login-logo a {
            color: #fff;
        }
        .connection-error-box {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .connection-error-box .error-icon {
            color: #dc2626;
            font-size: 2rem;
            display: block;
            text-align: center;
            margin-bottom: 10px;
        }
        .connection-error-box .error-title {
            color: #991b1b;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        .connection-error-box .error-message {
            color: #b91c1c;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="/"><i class="fas fa-chart-line"></i> <b>CPLS</b> Admin</a>
        </div>
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">
                    <i class="fas fa-shield-alt text-primary"></i> Vietnamese Stock Trading System
                </p>

                {{ if .connectionError }}
                <div class="connection-error-box">
                    <i class="fas fa-database error-icon"></i>
                    <div class="error-title">Database Connection Error</div>
                    <div class="error-message">{{ .connectionError }}</div>
                </div>
                {{ end }}

                {{ if .error }}
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle"></i> {{ .error }}
                </div>
                {{ end }}

                <form method="POST" action="/admin/login" {{ if .connectionError }}class="form-disabled"{{ end }}>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="username" placeholder="Username" required {{ if not .connectionError }}autofocus{{ end }} {{ if .connectionError }}disabled{{ end }}>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" name="password" placeholder="Password" required {{ if .connectionError }}disabled{{ end }}>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block" {{ if .connectionError }}disabled{{ end }}>
                                {{ if .connectionError }}
                                <i class="fas fa-times-circle"></i> Cannot Sign In
                                {{ else }}
                                <i class="fas fa-sign-in-alt"></i> Sign In
                                {{ end }}
                            </button>
                        </div>
                    </div>
                </form>

                <p class="mb-0 mt-3 text-center">
                    <a href="/" class="text-muted"><i class="fas fa-arrow-left"></i> Back to API</a>
                </p>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
